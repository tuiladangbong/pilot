name: Auto Curate & Ingest AI Resources

on:
  schedule:
    # Run automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of new resources to ingest'
        required: true
        default: '5'
      min_score:
        description: 'Minimum quality score threshold (1.0 - 10.0)'
        required: true
        default: '7.5'
      dry_run:
        description: 'Run in dry-run mode (do not write to production)'
        type: boolean
        required: true
        default: false

concurrency:
  group: auto-curate-pipeline
  cancel-in-progress: true

jobs:
  curate:
    name: Run Autonomous Curation Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Auto-Curate Pipeline
        env:
          PILOT_API_URL: ${{ secrets.PILOT_API_URL || 'https://pilot.nodbits.com' }}
          CURATOR_TOKEN: ${{ secrets.CURATOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '7.5' }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Running in DRY-RUN mode..."
            node scripts/auto-curate/index.mjs --dry-run --limit="$LIMIT" --min-score="$MIN_SCORE"
          else
            echo "Running in LIVE PUBLISH mode..."
            node scripts/auto-curate/index.mjs --publish --limit="$LIMIT" --min-score="$MIN_SCORE"
          fi
