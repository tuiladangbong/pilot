name: Auto Curate & Ingest AI Resources

on:
  schedule:
    # Scheduled runs are ALWAYS dry-run (discovery/report only). Publishing to production
    # requires a human to dispatch this workflow manually with dry_run=false.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of new resources to ingest'
        required: true
        default: '5'
      min_score:
        description: 'Minimum quality score threshold (1.0 - 10.0)'
        required: true
        default: '7.5'
      dry_run:
        description: 'Run in dry-run mode (do not write to production)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: auto-curate-pipeline
  cancel-in-progress: false

jobs:
  curate:
    name: Run Autonomous Curation Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Auto-Curate Pipeline
        env:
          PILOT_API_URL: ${{ secrets.PILOT_API_URL || 'https://pilot.nodbits.com' }}
          CURATOR_TOKEN: ${{ secrets.CURATOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Inputs are passed via env (never interpolated into the script) to avoid shell injection.
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_MIN_SCORE: ${{ github.event.inputs.min_score }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LIMIT="${INPUT_LIMIT:-5}"
          MIN_SCORE="${INPUT_MIN_SCORE:-7.5}"
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be an integer"; exit 1;; esac
          case "$MIN_SCORE" in ''|*[!0-9.]*) echo "min_score must be numeric"; exit 1;; esac

          # Fail safe: only an explicit manual dispatch with dry_run=false may publish.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "false" ]; then
            DRY_RUN="false"
          else
            DRY_RUN="true"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Running in DRY-RUN mode..."
            node scripts/auto-curate/index.mjs --dry-run --limit="$LIMIT" --min-score="$MIN_SCORE"
          else
            echo "Running in LIVE PUBLISH mode..."
            node scripts/auto-curate/index.mjs --publish --limit="$LIMIT" --min-score="$MIN_SCORE"
          fi
